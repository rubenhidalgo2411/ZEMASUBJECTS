<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visor de apuntes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#12121a;--card:#1a1a28;--border:#2a2a40;--neon-pink:#ff2d78;--neon-cyan:#00f5d4;--neon-yellow:#ffe600;--neon-purple:#a855f7;--text:#e8e8f0;--muted:#6b6b8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 20% 20%,rgba(255,45,120,.07) 0%,transparent 60%),radial-gradient(ellipse 50% 50% at 80% 80%,rgba(0,245,212,.06) 0%,transparent 60%),radial-gradient(ellipse 40% 60% at 60% 10%,rgba(168,85,247,.05) 0%,transparent 60%);pointer-events:none;z-index:0}
.container{max-width:900px;margin:0 auto;padding:40px 20px;position:relative;z-index:1}
header{text-align:center;padding:60px 0 40px}
.header-badge{display:inline-block;background:linear-gradient(135deg,var(--neon-pink),var(--neon-purple));color:#fff;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3px;padding:6px 16px;border-radius:20px;margin-bottom:20px;text-transform:uppercase}
h1{font-family:'Syne',sans-serif;font-size:clamp(32px,6vw,58px);font-weight:800;line-height:1.1;background:linear-gradient(135deg,#fff 30%,var(--neon-cyan) 70%,var(--neon-pink) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:16px;overflow-wrap:anywhere}
.subtitle{color:var(--muted);font-size:16px;max-width:500px;margin:0 auto}
.drop{border:2px dashed var(--border);border-radius:16px;background:var(--surface);padding:36px 20px;text-align:center;margin-bottom:24px;transition:border-color .2s,background .2s}
.drop.over{border-color:var(--neon-cyan);background:rgba(0,245,212,.08)}
.drop-t{font-family:'Syne',sans-serif;font-weight:700;font-size:18px}
.drop-s{color:var(--muted);font-size:14px;line-height:1.6;max-width:460px;margin:8px auto 18px}
.drop.compact{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:14px 18px}
.drop.compact .drop-t{font-size:14px;font-weight:600;color:var(--muted)}
.drop.compact .drop-s{display:none}
.drop.compact .glow-btn{padding:8px 18px;font-size:13px}
#status{margin-bottom:24px}
#status .answer-box,#status .error-box{margin-top:0;margin-bottom:10px;font-size:14px}
#status .answer-box div+div,#status .error-box div+div{margin-top:4px}
.topic-nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:40px}
#subs{margin-bottom:14px}
#subs:empty,#nav:empty{display:none}
.topic-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:7px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;transition:all .2s}
.topic-btn:hover,.topic-btn.active{border-color:var(--neon-cyan);color:var(--neon-cyan);background:rgba(0,245,212,.08)}
.sub-tab{display:inline-flex}
.sub-tab .topic-btn{border-radius:8px 0 0 8px}
.sub-tab .x{background:var(--card);border:1px solid var(--border);border-left:0;color:var(--muted);border-radius:0 8px 8px 0;padding:0 10px;cursor:pointer;font-size:16px}
.sub-tab.active .x{border-color:var(--neon-cyan)}
.sub-tab .x:hover{color:var(--neon-pink);background:rgba(255,45,120,.1)}
.section-header{display:flex;align-items:center;gap:14px;margin:40px 0 20px}
.section-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.section-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:700}
.section-count{margin-left:auto;flex-shrink:0;background:rgba(255,45,120,.15);color:var(--neon-pink);font-family:'Space Mono',monospace;font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid rgba(255,45,120,.3)}
.concept-card{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:14px;overflow:hidden;transition:border-color .2s,transform .15s;animation:fadeInUp .3s ease both}
.concept-card:hover{border-color:var(--neon-cyan);transform:translateY(-1px)}
.concept-header{padding:18px 20px;cursor:pointer;display:flex;align-items:flex-start;gap:14px;user-select:none}
.concept-q{flex:1;font-size:15px;line-height:1.5;font-weight:500}
.concept-q .tag{display:inline-block;font-family:'Space Mono',monospace;font-size:10px;padding:2px 8px;border-radius:4px;margin-right:8px;vertical-align:middle}
.tag-art{background:rgba(255,45,120,.2);color:var(--neon-pink);border:1px solid rgba(255,45,120,.3)}
.tag-def{background:rgba(0,245,212,.15);color:var(--neon-cyan);border:1px solid rgba(0,245,212,.3)}
.tag-key{background:rgba(168,85,247,.2);color:var(--neon-purple);border:1px solid rgba(168,85,247,.3)}
.tag-req{background:rgba(255,230,0,.15);color:var(--neon-yellow);border:1px solid rgba(255,230,0,.3)}
.tag-tabla{background:rgba(0,200,255,.15);color:#00c8ff;border:1px solid rgba(0,200,255,.3)}
.tag-practica{background:rgba(100,255,150,.15);color:#64ff96;border:1px solid rgba(100,255,150,.3)}
.tag-fuente{background:rgba(255,100,50,.15);color:#ff6432;border:1px solid rgba(255,100,50,.3)}
.tag-tip{background:rgba(200,100,255,.15);color:#c864ff;border:1px solid rgba(200,100,255,.3)}
.toggle-icon{color:var(--muted);font-size:20px;transition:transform .3s;flex-shrink:0;margin-top:2px}
.concept-card.open .toggle-icon{transform:rotate(45deg);color:var(--neon-cyan)}
.concept-body{display:none;padding:0 20px 20px;border-top:1px solid var(--border)}
.concept-card.open .concept-body{display:block}
.answer-box{background:rgba(0,245,212,.05);border:1px solid rgba(0,245,212,.2);border-radius:10px;padding:16px;margin-top:14px}
.answer-label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--neon-cyan);text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.answer-label::before{content:'';display:inline-block;width:16px;height:2px;background:var(--neon-cyan)}
.answer-text{font-size:14px;line-height:1.7;color:var(--text)}
.answer-text strong{color:var(--neon-cyan)}
.answer-text em{color:var(--neon-yellow);font-style:normal}
.answer-text ul,.answer-text ol{margin:8px 0 8px 18px}
.answer-text li{margin-bottom:4px}
.concept-body p{margin-bottom:8px}
.concept-body p:last-child{margin-bottom:0}
#nav .topic-btn{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.answer-text ul li::marker{color:var(--neon-cyan)}
.error-box{background:rgba(255,45,120,.07);border:1px solid rgba(255,45,120,.25);border-radius:10px;padding:14px 16px;margin-top:10px;font-size:13px;color:#ff8ab0;line-height:1.6}
.error-box::before{content:'⚠ Atención: ';font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--neon-pink);text-transform:uppercase;display:block;margin-bottom:6px}
.formula{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--neon-yellow);border-radius:8px;padding:14px 16px;margin-top:10px;font-family:'Space Mono',monospace;font-size:13px;color:var(--neon-yellow);line-height:1.8}
.formula-title{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.grid-2{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:10px;margin-top:10px}
@media(max-width:600px){.grid-2{grid-template-columns:1fr}header{padding:36px 0 28px}}
.mini-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.6}
.mini-title{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--neon-pink);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.tbl-wrap{overflow-x:auto;margin-top:12px}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{background:rgba(0,245,212,.1);color:var(--neon-cyan);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1px;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border)}
.data-table td{padding:10px 14px;border-bottom:1px solid rgba(42,42,64,.5);line-height:1.5}
.data-table tr:hover td{background:rgba(255,255,255,.02)}
.blockquote{border-left:3px solid var(--neon-purple);background:rgba(168,85,247,.07);border-radius:0 8px 8px 0;padding:12px 16px;margin-top:10px;font-size:13px;color:#d0b8f0;line-height:1.7;font-style:italic}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:40px 0}
.glow-btn{background:linear-gradient(135deg,var(--neon-pink),var(--neon-purple));border:none;color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;padding:12px 28px;border-radius:10px;cursor:pointer;transition:opacity .2s,transform .15s;box-shadow:0 0 20px rgba(255,45,120,.3)}
.glow-btn:hover{opacity:.9;transform:translateY(-1px)}
.concept-header:focus-visible,.topic-btn:focus-visible,.glow-btn:focus-visible,.x:focus-visible{outline:2px solid var(--neon-cyan);outline-offset:2px}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;position:relative;z-index:1;text-align:center}
.n-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(28px,5vw,44px);line-height:1.15;background:linear-gradient(135deg,#fff 30%,var(--neon-cyan) 70%,var(--neon-pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px}
.n-sub{color:var(--muted);font-size:14px;margin-bottom:36px;max-width:460px}
.n-grid{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;max-width:900px}
.ncard{width:130px;background:none;border:0;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;transition:color .25s}
.av{width:120px;height:120px;border-radius:16px;border:2px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:46px;transition:all .25s}
.ncard:hover,.ncard:focus-visible{color:var(--neon-cyan);outline:none}
.ncard:hover .av,.ncard:focus-visible .av{border-color:var(--neon-cyan);box-shadow:0 0 25px rgba(0,245,212,.35);transform:scale(1.08) translateY(-5px)}
.ncard.add .av{border-style:dashed;font-size:40px;color:var(--muted)}
.ncard.manage .av{border-color:var(--neon-yellow);box-shadow:0 0 15px rgba(255,230,0,.2)}
.ncard.manage:hover .av{border-color:var(--neon-pink);box-shadow:0 0 25px rgba(255,45,120,.4)}
.ncard .del{display:none;position:absolute;top:0;left:5px;width:120px;height:120px;border-radius:16px;background:rgba(10,10,15,.7);font-size:34px;align-items:center;justify-content:center}
.ncard.manage .del{display:flex}
.n-foot{margin-top:36px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.pill{font-family:'Space Mono',monospace;font-size:12px;color:var(--neon-cyan);border:1px solid rgba(0,245,212,.3);background:rgba(0,245,212,.08);padding:6px 14px;border-radius:20px}
#hstatus{width:100%;max-width:560px;margin-top:28px;text-align:left}
#hstatus .answer-box,#hstatus .error-box{margin:0 0 10px;font-size:14px}
.auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;text-align:left}
.auth-card label{display:block;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--neon-cyan);margin:14px 0 6px}
.auth-card label:first-child{margin-top:0}
.auth-card input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 14px;font:inherit;font-size:15px}
.auth-card input:focus{outline:none;border-color:var(--neon-cyan)}
.auth-card .glow-btn{width:100%;margin-top:20px}
.auth-card .glow-btn:disabled{opacity:.5;cursor:wait}
#amsg .error-box{margin-top:14px;font-size:13px}
.topbar{text-align:left}
.topbar+header{padding-top:24px}
#subs{display:none!important}
</style>
</head>
<body>
<div class="screen" id="auth" hidden>
  <div class="header-badge">⚡ Modo Repaso</div>
  <div class="n-title">Accede a tus apuntes</div>
  <div class="n-sub">Entra con tu usuario y contraseña de siempre.</div>
  <div class="auth-card">
    <label for="u">Usuario</label>
    <input id="u" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="p">Contraseña</label>
    <input id="p" type="password" autocomplete="current-password">
    <button class="glow-btn" id="go" type="button">Entrar</button>
    <div id="amsg" role="alert"></div>
  </div>
</div>

<div class="screen" id="home" hidden>
  <div class="n-title">¿Qué vas a estudiar hoy?</div>
  <div class="n-sub" id="hsub"></div>
  <div class="n-grid" id="hgrid"></div>
  <div id="hstatus" aria-live="polite"></div>
  <div class="n-foot">
    <span class="pill" id="who"></span>
    <button class="topic-btn" id="mng" type="button">⚙️ Administrar</button>
    <button class="topic-btn" id="out" type="button">Salir</button>
  </div>
</div>

<div class="container" id="app" hidden>
  <div class="topbar"><button class="topic-btn" id="back" type="button">👤 Cambiar de asignatura</button></div>
  <header>
    <div class="header-badge">⚡ Modo Repaso</div>
    <h1 id="h1"></h1>
    <p class="subtitle" id="sub"></p>
  </header>

  <div class="drop" id="drop">
    <div class="drop-t" id="dt"></div>
    <div class="drop-s">Puedes subir varios a la vez. Si subes otra parte de una asignatura que ya tienes, se une a ella sin duplicar temas.</div>
    <button class="glow-btn" id="pick" type="button"></button>
    <input id="file" type="file" accept=".json,application/json" multiple hidden>
  </div>

  <div id="status" aria-live="polite"></div>
  <div class="topic-nav" id="subs"></div>
  <div class="topic-nav" id="nav"></div>
  <main id="main"></main>

  <div id="foot" hidden>
    <div class="divider"></div>
    <div style="text-align:center;margin:20px 0 60px">
      <button class="glow-btn" type="button" onclick="scrollTo({top:0,behavior:'smooth'})">↑ Volver al inicio</button>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const OK=new Set(['STRONG','EM','UL','OL','LI','BR','P']);
function clean(v){const t=document.createElement('template');t.innerHTML=String(v??'');(function w(n){[...n.childNodes].forEach(c=>{if(c.nodeType===1){w(c);if(OK.has(c.tagName))[...c.attributes].forEach(a=>c.removeAttribute(a.name));else c.replaceWith(...c.childNodes)}else if(c.nodeType!==3)c.remove()})})(t.content);return t.innerHTML}
const H=(t,c,x)=>{const e=h(t,c);e.innerHTML=clean(x);return e};
const lb=v=>v&&v!=='null'?String(v):null;
const TAGS=['art','def','key','req','tabla','practica','fuente','tip'];

const B={
  answer:b=>{const e=h('div','answer-box'),l=lb(b.label);if(l)e.append(h('div','answer-label',l));e.append(H('div','answer-text',b.html));return e},
  blockquote:b=>H('div','blockquote',b.html),
  error:b=>H('div','error-box',b.html),
  formula:b=>{const e=h('div','formula'),l=lb(b.titulo);if(l)e.append(h('div','formula-title',l));e.append(H('div',null,b.html));return e},
  grid2:b=>{const g=h('div','grid-2');g.style.setProperty('--n',b.columnas.length);b.columnas.forEach(c=>{const m=h('div','mini-card');m.append(h('div','mini-title',c&&c.titulo),H('div',null,c&&c.html));g.append(m)});return g},
  tabla:b=>{const w=h('div','tbl-wrap'),t=h('table','data-table'),r=t.insertRow();b.cabeceras.forEach(x=>r.append(H('th',null,x)));b.filas.forEach(f=>{const r=t.insertRow();[].concat(f).forEach(x=>r.append(H('td',null,x)))});w.append(t);return w}
};
const ok=b=>b&&Object.hasOwn(B,b.tipo)&&(b.tipo==='grid2'?Array.isArray(b.columnas)&&b.columnas.length>0:b.tipo==='tabla'?Array.isArray(b.cabeceras)&&Array.isArray(b.filas):String(b.html??'').trim()!=='');

/* ---------- estado y persistencia ---------- */
let KEY='',st={subs:[],cur:0,topic:'all'};
function loadState(uid){KEY='apuntes-json-v1:'+uid;st={subs:[],cur:0,topic:'all'};try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&Array.isArray(r.subs)){st.subs=r.subs;st.cur=Math.min(r.cur|0,Math.max(0,r.subs.length-1))}}catch(_){}}
function save(){if(!KEY)return;try{localStorage.setItem(KEY,JSON.stringify({subs:st.subs,cur:st.cur}))}catch(_){note(['No se pudo guardar en este navegador. Tendrás que volver a subir los .json la próxima vez.'],true)}}
function note(lines,bad){const b=h('div',bad?'error-box':'answer-box');b.setAttribute('role',bad?'alert':'status');lines.forEach(l=>b.append(h('div',null,l)));$(view==='home'?'#hstatus':'#status').append(b)}

/* ---------- lectura y validación ---------- */
function parse(t){try{return JSON.parse(t)}catch(_){try{return JSON.parse(t.replace(/```(?:json)?/gi,'').split('\n').filter(l=>!/^\s*\/\//.test(l)).join('\n'))}catch(e){throw Error('no es un JSON válido ('+e.message+')')}}}
function norm(s){
  if(!s||typeof s.asignatura!=='string'||!s.asignatura.trim())throw Error('falta el campo "asignatura"');
  if(!Array.isArray(s.temas)||!s.temas.length)throw Error('falta la lista "temas"');
  let bad=0;
  const temas=s.temas.map((t,i)=>{
    if(!t||typeof t.titulo!=='string'||!Array.isArray(t.conceptos))throw Error('el tema '+(i+1)+' necesita "titulo" y "conceptos"');
    return{id:String(t.id??'t'+i),titulo:t.titulo,navLabel:String(t.navLabel||t.titulo),icono:String(t.icono||'📖'),
      iconBg:/^rgba?\([\d\s.,%]+\)$/.test(t.iconBg)?t.iconBg:'rgba(0,245,212,.12)',
      conceptos:t.conceptos.filter(c=>c&&typeof c.pregunta==='string').map(c=>({tag:String(c.tag||''),tagColor:TAGS.includes(c.tagColor)?c.tagColor:'def',pregunta:c.pregunta,
        bloques:(Array.isArray(c.bloques)?c.bloques:[]).filter(b=>{const k=ok(b);if(!k)bad++;return k})}))};
  });
  return{s:{asignatura:s.asignatura.trim(),subtitulo:String(s.subtitulo||''),temas},bad};
}
function merge({s,bad}){
  const extra=bad?' · '+bad+' bloques ignorados por formato incorrecto':'';
  const i=st.subs.findIndex(x=>x.asignatura.toLowerCase()===s.asignatura.toLowerCase());
  if(i<0){st.subs.push(s);st.cur=st.subs.length-1;return s.asignatura+': '+s.temas.length+' temas cargados'+extra}
  const T=st.subs[i].temas;let n=0;
  s.temas.forEach(t=>{const j=T.findIndex(x=>x.id===t.id);if(j<0){T.push(t);n++}else T[j]=t});
  if(s.subtitulo)st.subs[i].subtitulo=s.subtitulo;
  st.cur=i;
  return s.asignatura+' actualizada: '+n+' temas nuevos, '+(s.temas.length-n)+' reemplazados'+extra;
}
async function load(files){
  if(!files.length||(view!=='home'&&view!=='app'))return;
  $('#status').replaceChildren();$('#hstatus').replaceChildren();
  const oks=[],errs=[];
  for(const f of files){
    try{
      const d=parse(await f.text());
      (Array.isArray(d)?d:Array.isArray(d&&d.asignaturas)?d.asignaturas:[d]).forEach(s=>oks.push(merge(norm(s))));
    }catch(e){errs.push(f.name+' — '+e.message)}
  }
  st.topic='all';save();view==='home'?renderHome():render();
  if(oks.length)note(oks,false);
  if(errs.length)note([...errs,'Comprueba que el JSON esté completo (sin cortar) y que siga la estructura del prompt.'],true);
}

/* ---------- pintado ---------- */
function card(c){
  const e=h('div','concept-card'),hd=h('div','concept-header'),q=h('div','concept-q'),b=h('div','concept-body');
  if(c.tag)q.append(h('span','tag tag-'+c.tagColor,c.tag));
  q.append(c.pregunta);
  hd.append(q,h('div','toggle-icon','+'));
  hd.tabIndex=0;hd.setAttribute('role','button');hd.setAttribute('aria-expanded','false');
  e.append(hd,b);
  e.set=o=>{if(o&&!b.hasChildNodes())c.bloques.forEach(x=>b.append(B[x.tipo](x)));e.classList.toggle('open',o);hd.setAttribute('aria-expanded',o)};
  const tg=()=>e.set(!e.classList.contains('open'));
  hd.onclick=tg;
  hd.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();tg()}};
  return e;
}
const dz=$('#drop');
function render(){
  const S=st.subs[st.cur];
  $('#h1').textContent=S?S.asignatura:'Visor de apuntes';
  $('#sub').textContent=S?S.subtitulo:'Sube el .json de cada asignatura y estudia con tus apuntes interactivos';
  dz.className='drop'+(S?' compact':'');
  $('#dt').textContent=S?'Arrastra más .json aquí o':'Arrastra aquí los .json de tus asignaturas';
  $('#pick').textContent=S?'＋ Añadir .json':'Elegir archivos';
  $('#foot').hidden=!S;
  const sb=$('#subs'),nav=$('#nav'),main=$('#main');
  sb.replaceChildren();nav.replaceChildren();main.replaceChildren();
  st.subs.forEach((s,i)=>{
    const on=i===st.cur,w=h('span','sub-tab'+(on?' active':'')),b=h('button','topic-btn'+(on?' active':''),s.asignatura),x=h('button','x','×');
    b.type=x.type='button';
    b.onclick=()=>{st.cur=i;st.topic='all';save();render()};
    x.setAttribute('aria-label','Quitar '+s.asignatura);
    x.onclick=()=>{st.subs.splice(i,1);if(i<st.cur)st.cur--;st.cur=Math.max(0,Math.min(st.cur,st.subs.length-1));st.topic='all';save();render()};
    w.append(b,x);sb.append(w);
  });
  if(!S)return;
  [['all','Todos'],...S.temas.map((t,i)=>[i,t.navLabel])].forEach(([k,l])=>{
    const b=h('button','topic-btn'+(st.topic===k?' active':''),l);b.type='button';b.title=l;
    b.onclick=()=>{st.topic=k;render()};nav.append(b);
  });
  const a=h('button','topic-btn','↕ Abrir todo');a.type='button';
  a.onclick=()=>{const cs=[...document.querySelectorAll('.concept-card')],o=cs.some(c=>!c.classList.contains('open'));cs.forEach(c=>c.set(o));a.textContent=o?'↕ Cerrar todo':'↕ Abrir todo'};
  nav.append(a);
  S.temas.forEach((t,ti)=>{
    if(st.topic!=='all'&&st.topic!==ti)return;
    const sec=h('div','topic-section visible'),hd=h('div','section-header'),ic=h('div','section-icon',t.icono),n=t.conceptos.length;
    ic.style.background=t.iconBg;
    hd.append(ic,h('div','section-title',t.titulo),h('div','section-count',n+(n===1?' concepto':' conceptos')));
    sec.append(hd);t.conceptos.forEach(c=>sec.append(card(c)));main.append(sec);
  });
}

/* ---------- subida de archivos ---------- */
$('#pick').onclick=()=>$('#file').click();
$('#file').onchange=e=>{load([...e.target.files]);e.target.value=''};
addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)dz.classList.remove('over')});
addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');load([...e.dataTransfer.files])});

function pathKeySeguro(nombre) {
      let id = encodeURIComponent(String(nombre || 'sin_nombre'));
      id = id.replace(/[.#$\[\]\/]/g, '_');
      return id === '.' || id === '..' || id === '' ? 'sin_nombre' : id;
    }

function claveUsuario(nombre) {
      const normalizado = String(nombre || '').trim().toLowerCase().replace(/[^a-z0-9._-]/g, '').replace(/^\.+|\.+$/g, '');
      return pathKeySeguro(normalizado || 'usuario');
    }

let view='',manage=false,fb=null;
function show(v){view=v;$('#auth').hidden=v!=='auth';$('#home').hidden=v!=='home';$('#app').hidden=v!=='app';scrollTo(0,0)}
function amsg(t){const m=$('#amsg');m.replaceChildren();if(t)m.append(h('div','error-box',t))}
function renderHome(){
  const g=$('#hgrid');g.replaceChildren();
  $('#hsub').textContent=st.subs.length?'Elige una asignatura o añade otra subiendo su .json':'Aún no tienes asignaturas: sube el .json de la primera';
  $('#mng').classList.toggle('active',manage);
  st.subs.forEach((s,i)=>{
    const t=s.temas[0],c=h('button','ncard'+(manage?' manage':'')),a=h('div','av',t.icono);
    c.type='button';a.style.background=t.iconBg;c.append(a,h('div',null,s.asignatura));
    if(manage)c.append(h('div','del','🗑'));
    c.onclick=()=>{if(manage){st.subs.splice(i,1);st.cur=0;save();renderHome()}else{st.cur=i;st.topic='all';save();render();show('app')}};
    g.append(c);
  });
  const ad=h('button','ncard add');ad.type='button';ad.append(h('div','av','＋'),h('div',null,'Añadir .json'));
  ad.onclick=()=>$('#file').click();g.append(ad);
}
function home(){manage=false;renderHome();show('home')}
async function entrar(){
  const u=$('#u').value.trim(),p=$('#p').value;
  if(!u||!p)return amsg('Escribe tu usuario y tu contraseña.');
  if(!fb)return amsg('Aún no hay conexión con el servidor de cuentas. Comprueba tu conexión e inténtalo de nuevo.');
  $('#go').disabled=true;amsg('');
  try{
    let em=u.includes('@')?u.toLowerCase():null;
    if(!em)try{const s=await fb.get(fb.ref(fb.db,'usernames/'+claveUsuario(u)));em=(s.exists()&&s.val()&&s.val().email)||null}catch(_){}
    await fb.signIn(fb.auth,em||(u.toLowerCase().replace(/[^a-z0-9._-]/g,'').replace(/^\.+|\.+$/g,'')||'usuario')+'@testzema.local',p);
  }catch(e){
    const c=e.code;
    amsg(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(c)?'Usuario o contraseña incorrectos.':c==='auth/too-many-requests'?'Demasiados intentos. Espera un poco e inténtalo de nuevo.':c==='auth/network-request-failed'?'Sin conexión con el servidor.':'No se pudo entrar ('+(c||e.message)+').');
  }
  $('#go').disabled=false;
}
$('#go').onclick=entrar;
$('#u').onkeydown=e=>{if(e.key==='Enter')$('#p').focus()};
$('#p').onkeydown=e=>{if(e.key==='Enter')entrar()};
$('#mng').onclick=()=>{manage=!manage;renderHome()};
$('#out').onclick=()=>fb&&fb.out(fb.auth);
$('#back').onclick=home;
(async()=>{
  const V='https://www.gstatic.com/firebasejs/10.12.2/';
  try{
    const {initializeApp}=await import(V+'firebase-app.js'),{getDatabase,ref,get}=await import(V+'firebase-database.js'),A=await import(V+'firebase-auth.js');
    const app=initializeApp(firebaseConfig),auth=A.getAuth(app);
    await A.setPersistence(auth,A.browserLocalPersistence);
    fb={auth,db:getDatabase(app,firebaseConfig.databaseURL),ref,get,signIn:A.signInWithEmailAndPassword,out:A.signOut};
    A.onAuthStateChanged(auth,u=>{
      if(u){loadState(u.uid);$('#who').textContent='👤 '+(u.displayName||(u.email||'').split('@')[0]||'Usuario');$('#p').value='';home()}
      else{KEY='';st={subs:[],cur:0,topic:'all'};show('auth')}
    });
  }catch(e){show('auth');amsg('No se pudo conectar con el servidor de cuentas. Comprueba tu conexión; si lo ves dentro de Claude, descarga el archivo y ábrelo en tu navegador.')}
})();
